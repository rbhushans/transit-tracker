# SD-card protection for an always-on Pi.
#
# Install with:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp ~/transit-tracker/journald-transit.conf /etc/systemd/journald.conf.d/transit.conf
#   sudo systemctl restart systemd-journald
#
# Keeps logs in RAM instead of writing them to the SD card. Constant small log
# writes (especially from a crashing/restarting service) are a leading cause of
# SD-card corruption on Raspberry Pis. Logs won't survive a reboot, but for a
# kiosk-style display that's a fine trade. Use `journalctl -b` for current boot.
[Journal]
Storage=volatile
RuntimeMaxUse=16M
